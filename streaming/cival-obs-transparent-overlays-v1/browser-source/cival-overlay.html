<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cival OBS Overlay</title><style>:root{--a:#4ade9f;--b:#174d3b;--bg:#06110ecc;--fg:#effff7;--muted:#9eaaa5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}.o{position:relative;width:100vw;height:100vh;color:var(--fg)}.c{position:absolute;width:5vw;height:5vw;border-color:var(--a);border-style:solid}.tl{left:1.25vw;top:2.2vh;border-width:2px 0 0 2px}.tr{right:1.25vw;top:2.2vh;border-width:2px 2px 0 0}.bl{left:1.25vw;bottom:2.2vh;border-width:0 0 2px 2px}.br{right:1.25vw;bottom:2.2vh;border-width:0 2px 2px 0}.status{position:absolute;right:1.8vw;top:3vh;padding:.7rem 1.35rem;border:1px solid var(--a);border-radius:999px;background:var(--bg);color:var(--a);font:700 .72rem Consolas,monospace;letter-spacing:.14em}.status:before{content:'';display:inline-block;width:.45rem;height:.45rem;margin-right:.7rem;border-radius:50%;background:var(--a);box-shadow:0 0 12px var(--a)}.foot{position:absolute;left:2vw;right:2vw;bottom:2.4vh;height:2.2rem;border:1px solid var(--b);border-radius:999px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 1rem;font:700 .65rem Consolas,monospace;letter-spacing:.12em}.foot span:last-child{color:var(--muted);font-weight:400}.cam,.chat{display:none;position:absolute;border:2px solid var(--a);border-radius:16px;box-shadow:0 14px 38px #0008}.cam{right:3.1vw;bottom:9.2vh;width:22.2vw;aspect-ratio:16/9}.chat{right:3.1vw;top:11.6vh;width:20.3vw;height:72.8vh;border-color:var(--b);background:#06110ed9}.camera .cam,.camera-chat .cam,.chat-mode .chat,.camera-chat .chat{display:block}.camera-chat .cam{bottom:9.2vh}.camera-chat .chat{height:43vh}</style></head><body><div id="overlay" class="o"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><div class="status" id="status"></div><div class="cam"></div><div class="chat"></div><div class="foot"><span id="left"></span><span id="right"></span></div></div><script>const q=new URLSearchParams(location.search),o=document.getElementById('overlay');o.classList.add(q.get('mode')||'clean');document.documentElement.style.setProperty('--a',q.get('accent')||'#4ade9f');document.getElementById('status').textContent=q.get('status')||'PAPER MODE / LIVE BUILD';document.getElementById('left').textContent=q.get('left')||'CIVAL SYSTEMS IN ACTION';document.getElementById('right').textContent=q.get('right')||'DEMO ENVIRONMENT · NOT FINANCIAL ADVICE';</script></body></html>
